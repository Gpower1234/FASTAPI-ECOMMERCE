{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto py-8">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Your Shopping Cart</h1>

    <div id="cart-container" class="bg-white shadow-md rounded-lg overflow-hidden p-6">
        <!-- Dynamic content will be injected here by JavaScript -->
        <div id="empty-cart-message" class="text-center py-12 text-gray-500">
            <p class="text-xl mb-4">Your cart is currently empty.</p>
            <a href="/" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition">Start Shopping</a>
        </div>

        <div id="cart-content" class="hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b text-gray-600">
                        <th class="py-3">Product</th>
                        <th class="py-3">Price</th>
                        <th class="py-3">Quantity</th>
                        <th class="py-3">Total</th>
                        <th class="py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="cart-items-list">
                    <!-- Javascript populates items here -->
                </tbody>
            </table>

            <div class="mt-6 flex justify-between items-center border-t pt-4">
                <button id="clear-cart-btn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 transition">
                    Clear Cart
                </button>
                <div class="text-right">
                    <p class="text-lg text-gray-600">Subtotal: <span id="cart-subtotal" class="font-bold text-gray-900">$0.00</span></p>
                    <button id="checkout-btn" class="mt-3 bg-indigo-600 text-white px-6 py-3 rounded-md hover:bg-indigo-700 transition font-semibold">
                        Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        renderCartPage();

        document.getElementById('clear-cart-btn').addEventListener('click', () => {
            if (confirm('Are you sure you want to clear your cart?')) {
                localStorage.removeItem('cart');
                renderCartPage();
                updateCartBadge();
            }
        });

        document.getElementById('checkout-btn').addEventListener('click', () => {
            const token = localStorage.getItem('access_token');
            if (!token) {
                alert('Please log in before proceeding to checkout.');
                window.location.href = '/login-page';
                return;
            }
            alert('Checkout feature coming soon! Thank you for testing.');
        });
    });

    function renderCartPage() {
        const cart = getCart();
        const emptyMsg = document.getElementById('empty-cart-message');
        const cartContent = document.getElementById('cart-content');
        const itemsList = document.getElementById('cart-items-list');
        const subtotalEl = document.getElementById('cart-subtotal');

        if (cart.length === 0) {
            emptyMsg.classList.remove('hidden');
            cartContent.classList.add('hidden');
            return;
        }

        emptyMsg.classList.add('hidden');
        cartContent.classList.remove('hidden');

        itemsList.innerHTML = '';
        let subtotal = 0;

        cart.forEach((item, index) => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;

            const row = document.createElement('tr');
            row.className = 'border-b hover:bg-gray-50';
            row.innerHTML = `
                <td class="py-4 font-medium text-gray-800">${item.name}</td>
                <td class="py-4 text-gray-600">$${item.price.toFixed(2)}</td>
                <td class="py-4">
                    <div class="flex items-center space-x-2">
                        <button onclick="updateQuantity(${index}, -1)" class="bg-gray-200 px-2 py-1 rounded text-sm hover:bg-gray-300">-</button>
                        <span class="font-semibold">${item.quantity}</span>
                        <button onclick="updateQuantity(${index}, 1)" class="bg-gray-200 px-2 py-1 rounded text-sm hover:bg-gray-300">+</button>
                    </div>
                </td>
                <td class="py-4 font-semibold text-gray-800">$${itemTotal.toFixed(2)}</td>
                <td class="py-4 text-right">
                    <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 text-sm font-medium">Remove</button>
                </td>
            `;
            itemsList.appendChild(row);
        });

        subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
    }

    function updateQuantity(index, change) {
        let cart = getCart();
        cart[index].quantity += change;

        if (cart[index].quantity <= 0) {
            cart.splice(index, 1);
        }

        saveCart(cart);
        renderCartPage();
    }

    function removeItem(index) {
        let cart = getCart();
        cart.splice(index, 1);
        saveCart(cart);
        renderCartPage();
    }
</script>
{% endblock %}
